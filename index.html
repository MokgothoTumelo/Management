<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="agency-os.css">
  <link rel="stylesheet" href="auth.css">
  <title>Agency OS – Sign in</title>
</head>
<body data-page="auth">
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-name">Agency OS</div>
          <div class="brand-sub">Client operations</div>
        </div>
      </div>

      <h1 class="auth-title">Welcome</h1>
      <p class="auth-sub">Sign in to your account or create a new one.</p>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="tab-login" role="tab" aria-selected="true">Log in</button>
        <button type="button" class="auth-tab" id="tab-signup" role="tab" aria-selected="false">Sign up</button>
      </div>

      <div id="auth-message" class="auth-message" hidden></div>

      <div id="panel-login" class="auth-panel">
        <form id="form-login" autocomplete="on">
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="username" required placeholder="you@company.com">
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <div class="password-wrap">
              <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Your password">
              <button type="button" class="password-toggle" data-toggle-password="login-password" aria-label="Show password">Show</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary auth-submit" id="login-submit">Log in</button>
        </form>
        <p class="auth-switch">
          No account yet?
          <button type="button" onclick="switchAuthTab('signup')">Sign up</button>
        </p>
      </div>

      <div id="panel-signup" class="auth-panel" hidden>
        <form id="form-signup" autocomplete="on">
          <div class="field">
            <label for="signup-name">Name</label>
            <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="Your name">
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input id="signup-email" name="email" type="email" autocomplete="username" required placeholder="you@company.com">
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <div class="password-wrap">
              <input id="signup-password" name="password" type="password" autocomplete="new-password" required placeholder="Create a password">
              <button type="button" class="password-toggle" data-toggle-password="signup-password" aria-label="Show password">Show</button>
            </div>
          </div>
          <p class="auth-hint">
            At least 8 characters, with uppercase, lowercase, a number, and a special character.
          </p>
          <div class="field">
            <label for="signup-confirm">Confirm password</label>
            <div class="password-wrap">
              <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password" required placeholder="Repeat password">
              <button type="button" class="password-toggle" data-toggle-password="signup-confirm" aria-label="Show password">Show</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary auth-submit" id="signup-submit">Create account</button>
        </form>
        <p class="auth-switch">
          Already have an account?
          <button type="button" onclick="switchAuthTab('login')">Log in</button>
        </p>
      </div>

      <p class="auth-footer">
      Account and workspace information is saved to your personal account.
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
